name = "hex"
compatibility_date = "2026-08-07"

# Deploy target: Cloudflare Worker (NOT Pages). The @astrojs/cloudflare adapter
# builds dist/ and emits dist/server/wrangler.json (Worker entry + static assets +
# the bindings below). Deploy with `pnpm deploy`.
#
# Local dev: `pnpm dev` (astro dev via platformProxy, reads prod D1/R2 via
# remoteBindings). Apply schema + seed to prod with `pnpm db:push` and `pnpm db:seed`.
# Prerequisites: `wrangler login`, and the D1/R2 resources must exist remotely
# (`wrangler d1 create hex`, `wrangler r2 bucket create hex-assets`).
[[d1_databases]]
binding = "DB"
database_name = "hex"
database_id = "8902b21c-6616-472d-bac8-5df9248961ca"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "hex-assets"

# Admin authentication (Cloudflare Access)
# Set this to your Cloudflare Access Application Audience
# Leave empty for development (uses .dev.vars ADMIN_TOKEN)
[vars]
ADMIN_AUD = ""
